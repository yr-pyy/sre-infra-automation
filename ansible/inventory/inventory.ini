# ============================================
# Ansible 主机清单 (Inventory)
# 用法示例：ansible-playbook -i inventory/inventory.ini playbooks/nginx.yml
# ============================================

[web]
web01 ansible_host=192.168.1.11
web02 ansible_host=192.168.1.12

[db]
db01 ansible_host=192.168.1.21

# 把 web 和 db 归到 all_servers 组，方便批量操作
[all_servers:children]
web
db

# 所有主机的公共连接变量
[all:vars]
ansible_user=root
ansible_port=22
ansible_python_interpreter=/usr/bin/python3
